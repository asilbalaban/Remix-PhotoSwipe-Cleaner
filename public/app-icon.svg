<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1026" />
      <stop offset="40%" stop-color="#0f0e17" />
      <stop offset="100%" stop-color="#090a12" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="35%" stop-color="#ff9900" />
      <stop offset="70%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Card 1 (Back) Gradient -->
    <linearGradient id="cardBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2438" />
      <stop offset="100%" stop-color="#161224" />
    </linearGradient>

    <!-- Card 2 (Front) Gradient -->
    <linearGradient id="cardFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#342b4b" />
      <stop offset="100%" stop-color="#1f1830" />
    </linearGradient>

    <!-- Swipe Green Glow -->
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Swipe Rose Glow -->
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Gold Sparkle Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowLg" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#10b981" flood-opacity="0.8" />
    </filter>

    <filter id="glowRose" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.8" />
    </filter>

    <filter id="glowGold" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#fbbf24" flood-opacity="0.9" />
    </filter>

    <!-- Subtle Inner Reflection Clip -->
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="112" ry="112" />
    </clipPath>
  </defs>

  <!-- Base Android Squircle Outer Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" ry="116" fill="url(#borderGlow)" opacity="0.8" filter="url(#shadowLg)" />

  <!-- App Background Body -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- Diagonal Glass Light Flare in Background -->
  <g clip-path="url(#squircleClip)">
    <circle cx="90" cy="90" r="180" fill="#f43f5e" opacity="0.18" filter="blur(40px)" />
    <circle cx="420" cy="420" r="190" fill="#10b981" opacity="0.15" filter="blur(40px)" />
    <circle cx="430" cy="80" r="140" fill="#fbbf24" opacity="0.12" filter="blur(30px)" />
    
    <!-- Subtle Modern Grid/Aura -->
    <path d="M-50 150 L550 450" stroke="rgba(255,255,255,0.03)" stroke-width="2" />
    <path d="M-50 250 L550 550" stroke="rgba(255,255,255,0.03)" stroke-width="2" />
  </g>

  <!-- ==================== SWIPING PHOTO CARDS ==================== -->

  <!-- Card 1: Back Card (Tilted Left, representing swipe / stack) -->
  <g transform="translate(240, 260) rotate(-14) translate(-130, -160)" filter="url(#shadowLg)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="260" height="310" rx="26" fill="url(#cardBackGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2.5" />
    
    <!-- Photo Inner Area -->
    <rect x="18" y="18" width="224" height="210" rx="16" fill="#130e20" />
    
    <!-- Abstract Landscape Inside Back Card -->
    <path d="M 18 190 Q 70 140 130 180 T 242 165 L 242 228 L 18 228 Z" fill="#2d1f47" />
    <path d="M 60 228 L 110 160 L 150 228 Z" fill="#442a6d" opacity="0.7" />
    <circle cx="190" cy="70" r="22" fill="#fb7185" opacity="0.6" />

    <!-- Card Bottom Label Bar -->
    <rect x="22" y="248" width="120" height="12" rx="6" fill="rgba(255,255,255,0.15)" />
    <rect x="22" y="270" width="70" height="10" rx="5" fill="rgba(255,255,255,0.08)" />

    <!-- Mini Trash Indicator on Left -->
    <circle cx="215" cy="265" r="18" fill="url(#roseGlow)" filter="url(#glowRose)" />
    <path d="M209 261 L221 261 M212 261 L212 270 Q212 272 215 272 Q218 272 218 270 L218 261 M213 259 L217 259" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Dynamic Motion Swipe Trails (Curved Motion Lines) -->
  <path d="M 130 200 C 150 160, 220 150, 290 170" stroke="url(#roseGlow)" stroke-width="4" stroke-linecap="round" opacity="0.7" fill="none" />
  <path d="M 390 320 C 370 370, 310 390, 240 370" stroke="url(#greenGlow)" stroke-width="4" stroke-linecap="round" opacity="0.7" fill="none" />

  <!-- Card 2: Main Front Card (Tilted Right, Clean Focus) -->
  <g transform="translate(265, 255) rotate(7) translate(-130, -160)" filter="url(#shadowLg)">
    <!-- Card Outer Bezel -->
    <rect x="0" y="0" width="260" height="310" rx="26" fill="url(#cardFrontGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="3" />

    <!-- Glossy Highlight across top -->
    <path d="M 0 26 Q 130 0 260 26 L 260 0 L 0 0 Z" fill="rgba(255,255,255,0.12)" />

    <!-- Photo Picture Area -->
    <rect x="18" y="18" width="224" height="210" rx="16" fill="#0d1117" />
    
    <!-- Sunset Sky Gradient in Photo -->
    <defs>
      <linearGradient id="photoSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e1b4b" />
        <stop offset="60%" stop-color="#431407" />
        <stop offset="100%" stop-color="#7c2d12" />
      </linearGradient>
    </defs>
    <rect x="18" y="18" width="224" height="210" rx="16" fill="url(#photoSky)" />

    <!-- Sun Disc -->
    <circle cx="170" cy="85" r="28" fill="#fbbf24" opacity="0.9" filter="url(#glowGold)" />
    
    <!-- Mountain Silhouette -->
    <path d="M 18 228 L 75 140 L 125 190 L 175 125 L 242 210 L 242 228 Z" fill="#090d16" />
    <path d="M 95 228 L 145 160 L 195 228 Z" fill="#1e293b" opacity="0.6" />

    <!-- Card Bottom Elements (Date/Name lines) -->
    <rect x="22" y="246" width="130" height="14" rx="7" fill="rgba(255,255,255,0.4)" />
    <rect x="22" y="268" width="80" height="10" rx="5" fill="rgba(255,255,255,0.2)" />

    <!-- Keep / Heart Stamp on Right -->
    <circle cx="215" cy="264" r="20" fill="url(#greenGlow)" filter="url(#glowGreen)" />
    <path d="M215 272 C210 268, 206 264, 206 260 C206 257, 209 255, 212 255 C213.5 255, 214.5 256, 215 257 C215.5 256, 216.5 255, 218 255 C221 255, 224 257, 224 260 C224 264, 220 268, 215 272 Z" fill="#ffffff" />
  </g>

  <!-- ==================== SPARKLES & STARS ==================== -->

  <!-- Top-Right Big Golden 4-point Star -->
  <g transform="translate(395, 105)" filter="url(#glowGold)">
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Mid-Left Small Pink Star -->
  <g transform="translate(80, 200)" filter="url(#glowRose)">
    <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="url(#roseGlow)" />
  </g>

  <!-- Bottom-Right Emerald Sparkle -->
  <g transform="translate(415, 395)" filter="url(#glowGreen)">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#greenGlow)" />
  </g>

  <!-- Tiny Accent Dots -->
  <circle cx="340" cy="85" r="4" fill="#fef08a" opacity="0.9" />
  <circle cx="435" cy="180" r="5" fill="#fde047" opacity="0.8" />
  <circle cx="95" cy="340" r="4.5" fill="#f43f5e" opacity="0.8" />
  <circle cx="150" cy="425" r="4" fill="#34d399" opacity="0.8" />

  <!-- Glass Rim Top Highlight on Outer Squircle -->
  <path d="M 40 40 Q 256 16 472 40" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
